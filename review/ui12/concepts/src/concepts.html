<link rel="stylesheet" href="fonts/node_modules/@fontsource/cinzel/900.css" />

<link rel="stylesheet" href="fonts/node_modules/@fontsource/barlow-semi-condensed/700.css" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #121010; color: #eee; font-family: Inter, sans-serif; width: 1180px; }
  .sheet { padding: 24px; }
  .head { display: flex; align-items: flex-end; gap: 20px; height: 96px; margin-bottom: 20px; }
  .letter { font: 700 84px/0.8 Inter, sans-serif; color: #f2c14e; width: 80px; }
  .head h1 { font: 700 30px/1.1 Inter, sans-serif; color: #fff; }
  .head p { font: 400 16px/1.4 Inter, sans-serif; color: #c9c2b6; margin-top: 6px; max-width: 980px; }
  .row { display: flex; gap: 24px; }
  .phone { position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 34px; outline: 1px solid #3a3530; background-size: cover; flex: none; }
  .phone.setup { background-image: url(bg-setup.png); }
  .phone.run { background-image: url(bg-run.png); }
  .cap { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; justify-content: space-between; padding: 14px 26px 0; font: 600 14px Inter, sans-serif; color: #fff; text-shadow: 0 1px 3px #0008; z-index: 9; }
  .side { width: 300px; flex: none; display: flex; flex-direction: column; gap: 18px; font-size: 14px; color: #c9c2b6; }
  .side h3 { font: 700 12px Inter, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #8d857a; margin-bottom: 6px; }
  .spec { background: #1c1917; border: 1px solid #2c2724; border-radius: 12px; padding: 14px 16px; }
  .spec .big { font-size: 40px; line-height: 1.05; color: #fff; }
  .spec .ui { font-size: 17px; margin-top: 8px; color: #e8e1d6; }
  .spec .nm { font: 500 12px Inter, sans-serif; color: #8d857a; margin-top: 4px; }
  .sw { display: flex; gap: 8px; }
  .sw i { width: 44px; height: 44px; border-radius: 8px; outline: 1px solid #fff2; }
  .side ul { padding-left: 16px; line-height: 1.5; }
  .scrim-b { position: absolute; left: 0; right: 0; bottom: 0; height: 360px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.55)); pointer-events: none; }
  .scrim-t { position: absolute; left: 0; right: 0; top: 0; height: 140px; background: linear-gradient(180deg, rgba(0,0,0,0.45), transparent); pointer-events: none; }
  .hud { position: absolute; left: 0; right: 0; top: 168px; text-align: center; }
  .hud .sub { margin-top: 8px; font-size: 13px; display: flex; justify-content: center; gap: 18px; }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 34px; }
  svg { display: block; }
  .num { font-variant-numeric: tabular-nums; }
</style>
<style id="dir"></style>

<body>
<div class="sheet" id="sheet"></div>
<script>
const I = {
  snd: (c, w = 2) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`,
  menu: (c, w = 2) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`,
  plus: (c, w = 2.4) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  minus: (c, w = 2.4) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"><path d="M5 12h14"/></svg>`,
  coin: (s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f6b51e" stroke="#7a4300" stroke-width="2"/><circle cx="12" cy="12" r="6" fill="none" stroke="#ffe08a" stroke-width="1.6"/></svg>`,
  fret: (c) => `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="${c}" stroke-width="2"><path d="M2 16V2h14v10H7V7h5"/></svg>`,
};
const STAKE = '25.00', BAL = '1,000.00', MULT = '5.12', AMT = '128.00';

const D = {};

/* ============================================================ A. OBSIDIAN & JADE */
D.A = {
  name: 'Obsidian & Jade',
  why: 'Quiet luxury: black volcanic glass, one jade inlay line and hairline gold. Nothing shouts, so the scene and the number carry the drama.',
  fonts: ['Cormorant SC', 600, 'Inter', 500],
  sw: ['#050607', '#141a1c', '#2fae78', '#7fe6b4', '#d8b25a'],
  notes: ['Top bar: one floating glass capsule, logo · balance · sound · menu, split by jade hairlines', 'CTA: obsidian pill (Blender) with a jade inlay and gold rim; letter-spaced small caps', 'CASH OUT: the jade line lights up as heat rises'],
  css: `
  .A .tb { position:absolute; left:14px; right:14px; top:50px; height:52px; border-radius:26px; display:flex; align-items:center; background:rgba(6,8,9,0.78); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 1px rgba(216,178,90,0.55), 0 8px 24px rgba(0,0,0,0.5); padding:0 6px 0 20px; }
  .A .logo { font:600 17px 'Cormorant SC'; letter-spacing:0.28em; color:#efe6cf; }
  .A .div { width:1px; height:24px; background:linear-gradient(#0000,#3fbf86,#0000); margin:0 12px; }
  .A .bal { flex:1; display:flex; flex-direction:column; align-items:flex-end; }
  .A .bal small { white-space:nowrap; font:500 9px Inter; letter-spacing:0.22em; color:#7fe6b4; text-transform:uppercase; }
  .A .bal b { font:600 18px Inter; color:#fff; font-variant-numeric:tabular-nums; }
  .A .ic { width:44px; height:44px; display:grid; place-items:center; border-radius:22px; }
  .A .stake { border-radius:24px; background:rgba(6,8,9,0.8); backdrop-filter:blur(10px); box-shadow: inset 0 0 0 1px rgba(216,178,90,0.4); padding:14px 16px 16px; margin-bottom:14px; }
  .A .srow { display:flex; align-items:center; gap:10px; }
  .A .lbl { font:500 10px Inter; letter-spacing:0.22em; color:#8fa59b; text-transform:uppercase; }
  .A .circ { width:48px; height:48px; border-radius:24px; display:grid; place-items:center; box-shadow: inset 0 0 0 1px rgba(216,178,90,0.6); }
  .A .val { flex:1; text-align:center; font:600 26px Inter; color:#fff; }
  .A .val small { font:500 12px Inter; color:#8fa59b; margin-left:4px; }
  .A .chips { display:flex; gap:8px; margin-top:12px; }
  .A .chips span { flex:1; height:36px; border-radius:18px; display:grid; place-items:center; font:500 13px Inter; color:#d8d2c4; box-shadow: inset 0 0 0 1px rgba(127,230,180,0.35); }
  .A .cta { position:relative; height:64px; margin:0 -2px; background:url(art/a-obsidian.webp) center/100% 100%; display:flex; align-items:center; justify-content:center; }
  .A .cta .w { font:600 30px 'Cormorant SC'; letter-spacing:0.42em; padding-left:0.42em; background:linear-gradient(180deg,#fff7df,#e2c27a 60%,#b98d3a); -webkit-background-clip:text; color:transparent; filter: drop-shadow(0 2px 2px #000); }
  .A .cta.hot::after { content:''; position:absolute; inset:9px; border-radius:24px; box-shadow: 0 0 0 1.5px #6fffc0, 0 0 18px rgba(80,255,180,0.55), inset 0 0 22px rgba(80,255,180,0.25); }
  .A .cta.hot { justify-content:space-between; padding:0 52px 0 46px; }
  .A .cta.hot .w { font-size:19px; letter-spacing:0.3em; }
  .A .cta .amt { font:600 24px Inter; color:#fff; text-shadow:0 0 14px rgba(110,255,190,0.5); }
  .A .hint { text-align:center; margin-top:10px; font:500 11px Inter; letter-spacing:0.18em; color:#9db3a9; text-transform:uppercase; }
  .A .hud .m { font:500 112px/1 'Cormorant SC'; color:#fbf6ea; text-shadow:0 4px 30px rgba(0,0,0,0.6); letter-spacing:-0.01em; }
  .A .hud .m i { font-style:normal; font-size:0.4em; color:#7fe6b4; margin-left:4px; }
  .A .hud .sub { font:500 13px Inter; color:#c9d6cf; } .A .hud .sub b { color:#fff; font-weight:600; }
  `,
  top: () => `<div class="tb"><span class="logo">Causeway</span><span class="div"></span><span class="bal"><small>Demo balance</small><b>${BAL}</b></span><span class="div"></span><span class="ic">${I.snd('#d8b25a', 1.6)}</span><span class="ic">${I.menu('#d8b25a', 1.6)}</span></div>`,
  setup: () => `<div class="stake"><div class="srow" style="justify-content:space-between;margin-bottom:8px"><span class="lbl">Stake</span><span class="lbl" style="color:#5f7a6e">0.10 – 1,000</span></div><div class="srow"><span class="circ">${I.minus('#d8b25a', 1.8)}</span><span class="val num">${STAKE}<small>CR</small></span><span class="circ">${I.plus('#d8b25a', 1.8)}</span></div><div class="chips"><span>½</span><span>2×</span><span>10</span><span>50</span><span>Max</span></div></div><div class="cta"><span class="w">Run</span></div><div class="hint">Space to run</div>`,
  run: () => `<div class="cta hot"><span class="w">Cash out</span><span class="amt num">${AMT}</span></div><div class="hint">Stake ${STAKE} · Space to cash out</div>`,
  hud: () => `<div class="m num">${MULT}<i>×</i></div><div class="sub"><span>Stake <b>${STAKE}</b></span><span>Return <b>${AMT}</b></span></div>`,
};

/* ============================================================ B. SUNSTONE MEDALLION */
D.B = {
  name: 'Sunstone Medallion',
  why: 'The CTA is the sun stone itself: one big round thumb target, and the multiplier runs as a ring around it, so the calendar becomes the clock.',
  fonts: ['Tilt Warp', 400, 'Rubik', 500],
  sw: ['#5b4532', '#a08261', '#3a1d10', '#49d6c8', '#f2b23a'],
  notes: ['Top bar: separated corners, no bar; a round logo seal at left, a balance tab and round keys at right', 'CTA: a 200 px carved sun-stone disc (Blender); stake − / + sit on its flanks', 'CASH OUT: a turquoise-to-gold arc fills around the dial; the amount sits in the face'],
  css: `
  .B .seal { position:absolute; left:14px; top:50px; width:56px; height:56px; border-radius:50%; background: radial-gradient(circle at 40% 35%, #8a6a4c, #4a3526 70%); box-shadow: inset 0 0 0 3px #2c1f15, inset 0 0 0 5px #d39a34, 0 6px 14px #0009; display:grid; place-items:center; font:400 13px 'Tilt Warp'; color:#ffd36b; text-shadow:0 2px 0 #3a1d10; letter-spacing:0.02em; }
  .B .rt { position:absolute; right:14px; top:50px; display:flex; gap:8px; align-items:center; }
  .B .tab { height:46px; padding:0 18px 0 16px; border-radius:23px; background: linear-gradient(#6d533c, #4a3526); box-shadow: inset 0 0 0 2px #2c1f15, inset 0 0 0 4px #c8902f, 0 6px 14px #0009; display:flex; flex-direction:column; justify-content:center; align-items:flex-end; }
  .B .tab small { font:500 9px Rubik; letter-spacing:0.16em; color:#e8c98f; text-transform:uppercase; }
  .B .tab b { font:700 17px Rubik; color:#fff4d8; }
  .B .rk { width:46px; height:46px; border-radius:50%; display:grid; place-items:center; background: radial-gradient(circle at 40% 35%, #7d6046, #45342a); box-shadow: inset 0 0 0 2px #2c1f15, inset 0 0 0 4px #c8902f, 0 6px 14px #0009; }
  .B .dock { padding-bottom:30px; }
  .B .chips { display:flex; justify-content:center; gap:8px; margin-bottom:14px; }
  .B .chips span { width:52px; height:36px; border-radius:18px; display:grid; place-items:center; font:500 13px Rubik; color:#fff4d8; background:rgba(40,28,20,0.82); box-shadow: inset 0 0 0 1.5px #a0794a; }
  .B .medrow { display:flex; align-items:center; justify-content:center; gap:14px; }
  .B .side-b { width:54px; height:54px; border-radius:50%; display:grid; place-items:center; background: radial-gradient(circle at 40% 35%, #7d6046, #45342a); box-shadow: inset 0 0 0 2px #2c1f15, inset 0 0 0 4px #c8902f, 0 6px 14px #0009; }
  .B .med { position:relative; width:220px; height:220px; background:url(art/b-sunstone.webp) center/contain no-repeat; filter: drop-shadow(0 10px 16px #000a); }
  .B .face { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .B .face .w { font:400 40px/1 'Tilt Warp'; color:#ffd36b; -webkit-text-stroke: 6px #2a1206; paint-order: stroke fill; text-shadow: 0 4px 0 #2a1206; letter-spacing:0.02em; }
  .B .face small { font:700 13px Rubik; color:#fff4d8; margin-top:4px; letter-spacing:0.04em; }
  .B .face .k { font:400 14px 'Tilt Warp'; color:#ffd36b; -webkit-text-stroke: 4px #2a1206; paint-order: stroke fill; }
  .B .face .a { font:700 26px Rubik; color:#fff; text-shadow:0 2px 0 #2a1206, 0 0 10px #0008; }
  .B .ring { position:absolute; inset:-14px; }
  .B .stk { text-align:center; margin-bottom:10px; font:500 12px Rubik; color:#f3e2c0; letter-spacing:0.12em; text-transform:uppercase; text-shadow:0 1px 3px #000; }
  .B .stk b { display:block; font:400 30px 'Tilt Warp'; color:#fff4d8; letter-spacing:0; -webkit-text-stroke: 5px #2a1206; paint-order: stroke fill; }
  .B .hud { top:150px; }
  .B .hud .m { font:400 96px/1 'Tilt Warp'; color:#fff4d8; -webkit-text-stroke: 10px #2a1206; paint-order: stroke fill; text-shadow:0 6px 0 #2a1206, 0 10px 30px #000a; }
  .B .hud .m i { font-style:normal; color:#ffbf3a; font-size:0.5em; }
  .B .hud .sub { font:500 14px Rubik; color:#f3e2c0; text-shadow:0 1px 3px #000; } .B .hud .sub b { color:#fff; font-weight:700; }
  `,
  top: () => `<div class="seal">CWY</div><div class="rt"><div class="tab"><small>Demo balance</small><b class="num">${BAL}</b></div><span class="rk">${I.snd('#ffd36b')}</span><span class="rk">${I.menu('#ffd36b')}</span></div>`,
  setup: () => `<div class="chips"><span>½</span><span>2×</span><span>10</span><span>50</span><span>Max</span></div><div class="stk">Stake<b class="num">${STAKE}</b></div><div class="medrow"><span class="side-b">${I.minus('#ffd36b')}</span><div class="med"><div class="face"><span class="w">RUN</span><small>Space</small></div></div><span class="side-b">${I.plus('#ffd36b')}</span></div>`,
  run: () => {
    const r = 124, C = 2 * Math.PI * r, f = 0.62;
    const ticks = Array.from({ length: 40 }, (_, i) => { const a = (i / 40) * 2 * Math.PI - Math.PI / 2; const r0 = 118, r1 = i % 5 ? 122 : 126; return `<line x1="${124 + r0 * Math.cos(a)}" y1="${124 + r0 * Math.sin(a)}" x2="${124 + r1 * Math.cos(a)}" y2="${124 + r1 * Math.sin(a)}" stroke="#f3e2c0" stroke-opacity="0.55" stroke-width="1.4"/>`; }).join('');
    const ah = -Math.PI / 2 + f * 2 * Math.PI;
    return `<div class="medrow" style="margin-bottom:6px"><div class="med" style="margin-top:20px"><svg class="ring" viewBox="0 0 248 248" width="248" height="248"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#49d6c8"/><stop offset="1" stop-color="#ffbf3a"/></linearGradient></defs><circle cx="124" cy="124" r="${r - 6}" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="9"/><circle cx="124" cy="124" r="${r - 6}" fill="none" stroke="url(#bg1)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${f * 2 * Math.PI * (r - 6)} 9999" transform="rotate(-90 124 124)" style="filter:drop-shadow(0 0 6px #ffbf3a)"/>${ticks}<circle cx="${124 + (r - 6) * Math.cos(ah)}" cy="${124 + (r - 6) * Math.sin(ah)}" r="7" fill="#fff4d8" stroke="#2a1206" stroke-width="2"/></svg><div class="face"><span class="k">CASH OUT</span><span class="a num">${AMT}</span><small>${MULT}×</small></div></div></div><div class="stk" style="margin:14px 0 0">Next sun at 10×</div>`;
  },
  hud: () => `<div class="m num">${MULT}<i>×</i></div><div class="sub"><span>Stake <b>${STAKE}</b></span><span>Return <b>${AMT}</b></span></div>`,
};

/* ============================================================ C. MOBILE-GAME CHUNKY */
D.C = {
  name: 'Arcade Runner',
  why: 'Bright, bouncy and readable at arm\'s length: the chunky, glossy language of Temple Run and Subway Surfers, built for thumbs and fun.',
  fonts: ['Lilita One', 400, 'Nunito', 900],
  sw: ['#5ad13a', '#2e9e1a', '#ffcf2e', '#ff8a00', '#2fa8ff'],
  notes: ['Top bar: chunky separate buttons; a tilted logo badge, a fat coin pill with a green +, square keys', 'CTA: a candy-gloss green slab, thick dark outline, 6 px 3D lip, white outlined type', 'CASH OUT: hot orange-yellow; the amount bounces on each tick'],
  css: `
  .C .badge { position:absolute; left:12px; top:56px; transform:rotate(-5deg); padding:5px 9px 7px; border-radius:12px; background:linear-gradient(#ffd84a,#ff9d00); border:3px solid #3b1d00; box-shadow:0 5px 0 #3b1d00; font:400 15px 'Lilita One'; color:#fff; -webkit-text-stroke:5px #3b1d00; paint-order:stroke fill; letter-spacing:0.02em; }
  .C .rt { position:absolute; right:12px; top:52px; display:flex; gap:6px; }
  .C .pill { height:46px; display:flex; align-items:center; gap:6px; padding:0 4px 0 8px; border-radius:23px; background:#1d2a4a; border:3px solid #0b1226; box-shadow:0 4px 0 #0b1226, inset 0 3px 0 rgba(255,255,255,0.15); }
  .C .pill b { font:900 16px Nunito; color:#fff; }
  .C .pill .p { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(#7cea4c,#33a51b); border:2.5px solid #12380a; }
  .C .sq { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(#5cc0ff,#1f7fe0); border:3px solid #0b2b55; box-shadow:0 4px 0 #0b2b55, inset 0 3px 0 rgba(255,255,255,0.35); }
  .C .stake { border-radius:24px; background:linear-gradient(#2a3d6e,#1b2850); border:3px solid #0b1226; box-shadow:0 6px 0 #0b1226, inset 0 3px 0 rgba(255,255,255,0.12); padding:12px 12px 14px; margin-bottom:16px; }
  .C .srow { display:flex; align-items:center; gap:10px; }
  .C .rb { width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(#5cc0ff,#1f7fe0); border:3px solid #0b2b55; box-shadow:0 4px 0 #0b2b55, inset 0 3px 0 rgba(255,255,255,0.35); }
  .C .val { flex:1; height:52px; border-radius:16px; background:#0e1733; display:flex; align-items:center; justify-content:center; gap:6px; font:900 26px Nunito; color:#fff; box-shadow: inset 0 3px 0 #0006; }
  .C .chips { display:flex; gap:6px; margin-top:10px; }
  .C .chips span { flex:1; height:38px; border-radius:12px; display:grid; place-items:center; font:900 15px Nunito; color:#fff; background:#3a5296; border:2.5px solid #0b1226; box-shadow:0 3px 0 #0b1226; }
